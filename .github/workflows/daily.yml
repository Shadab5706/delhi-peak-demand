name: Daily forecast and site

on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST, after SLDC publishes yesterday's full day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Check that Delhi SLDC is reachable
        continue-on-error: true
        run: |
          python -c "import sys, datetime; sys.path.insert(0, 'pipeline'); import live; d = datetime.date.today() - datetime.timedelta(days=2); print('SLDC check', d, live.sldc_day(d))"
      - name: Run the live forecast
        run: python pipeline/live.py
      - name: Commit the new forecast
        run: |
          git config user.name "forecast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast_latest.json data/forecast_log.json pipeline/data
          git diff --cached --quiet || git commit -m "Daily forecast $(TZ=Asia/Kolkata date +%F)"
          git push

  deploy:
    needs: forecast
    if: always() && (needs.forecast.result == 'success' || needs.forecast.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
